name: Builds, tests & co

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        mobx-version: ['^6.13.6', '^7.0.0']
        query-version: ['^7.4.0', '^8.0.0']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up Node.js
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Select MobX and mobx-tanstack-query versions
        run: |
          pnpm add --save-dev "mobx@${{ matrix.mobx-version }}"
          pnpm add "mobx-tanstack-query@${{ matrix.query-version }}"

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build

      - run: pnpm docs:build

      # - run: pnpm test:coverage
