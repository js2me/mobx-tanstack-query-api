name: Builds, tests & co

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        mobx-version: ['^6.13.6', '^7.0.0']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up Node.js
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - name: Select MobX version
        run: |
          node -e "const fs = require('node:fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); p.devDependencies.mobx = process.env.MOBX_VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
        env:
          MOBX_VERSION: ${{ matrix.mobx-version }}

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build

      - run: pnpm docs:build

      # - run: pnpm test:coverage
